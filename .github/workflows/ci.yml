name: CI

on:
  pull_request:
  push:
    branches: [main]

# cancel-in-progress is deliberately NOT applied to main.
#
# Every push shares one ref per branch, so on main the next push cancelled the
# previous run mid-flight — and because docs commits often follow a merge within
# seconds, main runs were being killed by the very next commit. Measured
# 2026-08-19: two main runs cancelled, each ending within ~20s of the following
# run starting (f5d3d72 and ea22f30). Nothing was wrong with the runner; the
# config was doing exactly what it said.
#
# The consequence was that a merge could land on main with its verification
# silently discarded. pr:green gates the MERGE correctly and always did, but
# nothing watched main afterwards.
#
# PRs keep the cancellation, which is where it earns its keep: force-pushing a
# branch should not leave a stale run burning minutes.
#
# INTENDED BEHAVIOUR CHANGE: two main runs can now overlap when merges land
# close together. They are different commits and both deserve verifying, so
# that is the point rather than a side effect.
#
# THAT INTENT WAS NOT WHAT THE CONFIG DID, and it cost a run on 2026-09-08.
# Turning cancel-in-progress off does not let runs overlap — it SERIALISES
# them, and a concurrency group holds exactly ONE pending run. A third arrival
# does not queue behind the second; it takes the pending slot and CANCELS the
# run already waiting in it. Three merges inside eleven minutes was enough:
# ace9e83 was running, 7870358 went pending, 390852f arrived and displaced it.
# 7870358 shipped to production with zero jobs ever started. The watchdog said
# so, loudly and correctly — the config was the thing that was wrong.
#
# So main is keyed PER COMMIT. Every main SHA gets a group of its own, which
# has nothing to queue behind and nothing to displace it, and the overlap the
# comment above always intended is what actually happens now. PR branches keep
# their per-ref group and their cancellation, which is where it earns its keep.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Prerendered freshness guard below needs real git history to
          # diff against — the default shallow (depth-1) clone only has
          # this one commit, nowhere near enough to compare against the
          # PR's base branch.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Production incident, 2026-07-24: the committed prerendered/
      # snapshots reference /assets/*.js|css filenames from whatever build
      # generated them locally. SENTRY_AUTH_TOKEN is set on Vercel, so
      # @sentry/vite-plugin gives every `vite build` a fresh debug id,
      # changing built chunks' content hashes even from identical source —
      # confirmed against the actual failing deployment's build log, which
      # never produced the filename the live site's HTML referenced. This
      # step runs the exact same apply step Vercel's buildCommand runs,
      # against THIS PR's own fresh build (this workflow doesn't set
      # SENTRY_AUTH_TOKEN, so the hash mismatch this guards against won't
      # even reproduce here — but the assert-every-asset-exists check inside
      # apply-prerendered.mjs is unconditional, so it still fails loudly if
      # a committed snapshot references anything genuinely absent from
      # dist/assets, for any reason, not just this one). See
      # scripts/lib/rewritePrerenderedAssets.mjs and
      # tests/persistence/prerender-asset-rewrite.mjs (covered by
      # npm run test:ci above) for the unit-level coverage of the same logic.
      - name: Prerendered asset references guard
        run: node scripts/apply-prerendered.mjs

      # Structural guard, not a reminder: fails if a marketing-page source
      # file changed without prerendered/ also changing in the same diff.
      # Added 2026-08-04 after four consecutive marketing PRs merged in a
      # row without anyone running `npm run build:prerender` — production
      # kept serving pre-batch, stale static HTML to crawlers/no-JS clients
      # at every touched route while a real browser (client-side React
      # Static source analysis, no credentials — same shape as the
      # prerendered freshness guard above, for the dashboard + universe
      # builder US-English spelling sweep (D9, 2026-08-04). Fails if a
      # changed dashboard/universe-builder file introduces a British/
      # Australian spelling (colour, favourite, organise, ...) in a
      # non-comment line. See scripts/test-us-english-spelling.mjs.
      - name: Canon on a branch
        # Canon files belong on main. A pre-push hook is local and does not see
        # an edit made through the GitHub UI, so this runs here too.
        run: node scripts/check-canon-branch.mjs --ci origin/${{ github.base_ref || 'main' }}

      - name: Payments freeze
        # A pre-push hook watches ONE of four doors: a merge in the GitHub UI, a
        # push from another clone, and `--no-verify` all reach main without it.
        # And --no-verify skips the payments check AND lint together, so the
        # careless midnight act of skipping lint silently carries the dangerous
        # one. A guard must observe through the same channel as the traffic it
        # guards, and that channel is "a change reaches main".
        #
        # The override here is a commit trailer, not an env var — it survives in
        # the log where someone can read it a year later.
        run: node scripts/check-payments-freeze.mjs --ci origin/${{ github.base_ref || 'main' }}

      - name: US-English spelling guard
        env:
          GH_EVENT_BEFORE: ${{ github.event.before }}
        run: npm run test:us-english-spelling

      - name: Lint
        run: npm run lint

      # Static source analysis, no credentials — catches the case-insensitive
      # route-collision/self-redirect bug class (fix/dashboard-round5) that
      # silently left Transport/Accommodation/Honeymoon blank in production
      # with no build or lint failure. See scripts/test-route-collisions.mjs.
      - name: Dependency audit
        # THRESHOLD IS `critical`, DELIBERATELY, AND IT IS NOT A CLEAN BILL.
        # The tree carries 34 advisories today: 17 high, 15 moderate, 2 low,
        # 0 critical. A threshold of `high` would fail this workflow on every
        # PR from the moment it lands, which turns a security signal into an
        # obstacle people learn to bypass. `critical` passes today and catches
        # the class that must never ship. Raising it is the owner's call and
        # belongs with the work to fix the 17 — see the ledger.
        run: npm run audit:ci

      - name: Guest read boundary guard
        run: npm run test:guest-read-boundary

      - name: The reply is never behind More
        run: npm run test:nav-rsvp-visible

      - name: Ava eval set shape
        run: npm run test:ava-eval-set

      - name: Route collision guard
        run: npm run test:route-collisions

      # Static source analysis, no credentials — catches the vendor-contact
      # pattern drifting back into per-page hand-rolled forms (dashboard
      # round 6, item 5 — the fifth time this exact drift was reported).
      # See scripts/test-vendor-contact-consistency.mjs.
      - name: Vendor-contact consistency guard
        run: npm run test:vendor-contact-consistency

      # Static source analysis, no credentials — catches the marketing hero
      # drifting back into per-page hand-rolled full-viewport sections
      # (font size, gradient, scroll cue all independently reinvented across
      # Features/Ava/Universes/Pricing before this guard existed). See
      # scripts/test-marketing-hero-consistency.mjs.
      - name: Marketing hero consistency guard
        run: npm run test:marketing-hero-consistency

      # No network, no credentials — stubs fetch and localStorage and asserts
      # every state getWeddingWeather can return is reachable and correct. The
      # one that matters is not-found vs unavailable: not-found is the only
      # state a couple can act on, so misclassifying a geocoder outage as
      # not-found tells someone to fix a perfectly good venue address. That
      # defect was real and this guard is what caught it.
      - name: Weather state guard
        run: npm run test:weather-states

      # No network, no credentials — asserts the canonical attendee resolver's
      # invariants: synthetic plus-one ids are unique, deterministic, cannot
      # collide with a real 24-hex Base44 id, and round-trip back to the host;
      # a bare `plus_one: true` permission flag yields no attendee; and RSVP
      # matches src/lib/plusOne.js exactly, so the resolver and the guest table
      # can never disagree. Live-data facts are in verify-attendees-live.mjs,
      # which needs credentials and is deliberately not run here.
      - name: Attendee resolver guard
        run: npm run test:attendees

      # No network, no credentials — proves the seating write-path refactor is
      # payload-identical to the code it replaced (100 assignment/removal
      # combinations compared against the pre-refactor expressions verbatim),
      # and that the already-seated toast string is unchanged.
      - name: Table assignment payload equivalence
        run: npm run test:table-assignment

      # Static source scan. src/lib/tableAssignment.js called itself the
      # "single write path" while Seating.jsx wrote seats directly from three
      # places — the comment asserting the rule is what let it rot. This makes
      # the rule enforceable: seating writes exist in exactly one file.
      - name: Single seating write path guard
        run: npm run test:single-table-write-path

      # no-use-before-define is `error` repo-wide with 56 files carved out —
      # they violated it the day it was enabled, after #429 put /Seating into a
      # production ErrorBoundary via a temporal dead zone that no-undef cannot
      # model. This guard makes the carve-out one-way: it fails if a path is
      # added or the count rises. Removing entries is free.
      - name: no-use-before-define carve-out ratchet
        run: npm run test:no-use-before-define-ratchet

      # The couple's names had two disagreeing sources: couple1Name/couple2Name
      # (the truth, edited in EventDetails and the builder) and coupleNames (a
      # copy written once at onboarding and never re-derived). Forty-odd
      # surfaces read the copy, and every fallback in the repo consulted it
      # FIRST — so the one case the fallback existed for was the only case it
      # handled right. The wedding address now derives from these names, which
      # is why the ownership has to hold.
      - name: couple names have one owner
        run: npm run test:couple-names

      # The merge gate counted SKIPPED and NEUTRAL as green while ~15 merge
      # authorizations carried "SKIPPED is not PASS" as their condition. The
      # words and the mechanism disagreed for every one of them.
      - name: the merge gate refuses what it should
        run: npm run test:pr-gate

      # SongRequest.status declares four values; the Music page offered three
      # tabs. A request marked 'added' was counted in the headline and shown
      # under no tab — one such row existed in production. Reads the schema, so
      # a new enum value fails here rather than going invisible.
      - name: song request filters cover their domain
        run: npm run test:song-status-coverage

      # Schedule.jsx and ScheduleHub.jsx sorted by start_time only — event_date
      # was not a sort key at all, so 1 January sat above 31 December for every
      # couple with more than one day of events.
      - name: the schedule runs forwards
        run: npm run test:schedule-order

      # The guest nav was assembled from two lists that overlapped on four
      # labels — Music, Stay, Getting here, Experiences — with nothing
      # reconciling them, so each rendered twice in a couple's own navigation.
      - name: each page appears once in the guest nav
        run: npm run test:nav-no-duplicates

      # enabledPages was computed and never consulted, so every page a couple
      # turned off was live on a direct URL — including an experience guide
      # with published: false. Publishing gated the nav link and nothing else.
      - name: an unpublished page is not reachable
        run: npm run test:page-gate

      # --no-verify skips the pre-push hook. The payments freeze runs in CI for
      # exactly that reason, and a credential in a commit is the same class of
      # thing: it must not be behind a switch a tired person can flip.
      - name: no credential files in this branch
        run: npm run check:no-credentials

      # Credential-free subset of the persistence suite — no live Base44
      # login, no BASE44_ADMIN_KEY. That key is full production database
      # access and deliberately does not live in GitHub secrets; the live
      # round-trip suite (npm run test:persistence) stays a required LOCAL
      # pre-merge step instead (WORKFLOW.md), partly so PR/push-triggered CI
      # runs can never collide with a live local test run against the same
      # production data. See scripts/test-ci.mjs for exactly which modules
      # this covers and why.
      - name: Run CI test suite (credential-free)
        run: npm run test:ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Chromium's own binary is restored from cache above, but its OS-level
      # shared library dependencies (installed via --with-deps) are NOT part
      # of that cache — they live in system package directories, not
      # ~/.cache/ms-playwright. A cache hit still needs them installed on
      # this fresh runner, just not re-downloading the (large) browser.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # MOVED HERE FROM BEFORE THE BUILD STEPS, 2026-09-08, because it now
      # needs a browser and this is the first point in the job that has one.
      #
      # #709 gave this guard a fallback: when a diff cannot answer the
      # question — an empty range, or any run on main — it renders all
      # fourteen marketing routes and compares bodies. That fallback fired on
      # main immediately after #709 merged and crashed on
      # `browserType.launch: Executable doesn't exist`, because it sat at line
      # 87, one hundred and seventy lines before `npx playwright install`.
      #
      # The guard was right and its placement was wrong. It stays a required
      # step; it simply runs after Chromium exists. The diff path costs the
      # same wherever it sits, and the fallback cannot run anywhere earlier.
      # Needs the same preview server and browser as the guards above. The
      # resume path it checks was written long ago and inert until c832e9e
      # declared onboardingDraft — so this is the first CI run it has ever had.
      # The breadcrumb's WORDS and its painted-ness, on two universe routes.
      # Each hides the other's failure: right words behind an overlay reads
      # correct in the DOM; wrong words on screen reads correct in a
      # screenshot.
      - name: Custom pages keep their order, and the builder shows its controls
        run: |
          npx vite preview --port 4181 --strictPort &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4181 > /dev/null; then break; fi
            sleep 1
          done
          CAPTURE_BASE_URL=http://localhost:4181 npm run test:builder-custom-pages
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      # The builder has two preview surfaces, each with its own copy of the
      # device list and the widths. This measures both in one run and compares
      # them, so the next divergence is a red run rather than a report.
      - name: The full-page preview offers the devices the canvas does
        run: |
          npx vite preview --port 4182 --strictPort &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4182 > /dev/null; then break; fi
            sleep 1
          done
          CAPTURE_BASE_URL=http://localhost:4182 npm run test:full-preview-devices
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      # The other half of the same report, which needed a schema field before
      # it could be built. Checks the canvas, the SAVE PAYLOAD, and the
      # published site, because the render bug lived in two components and a
      # pass that only looked at the builder would have missed the guest's.
      - name: A custom page opens with an add control and keeps what it is given
        run: |
          npx vite preview --port 4183 --strictPort &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4183 > /dev/null; then break; fi
            sleep 1
          done
          CAPTURE_BASE_URL=http://localhost:4183 npm run test:custom-page-blocks
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      # Every universe, because "names off" is one CSS rule resting on an
      # assumption held across twenty layout files: the h1 in a Masthead is
      # the couple's names. The kicker check is what separates hiding the
      # names from hiding the masthead.
      - name: The hero switches, on every universe
        run: |
          npx vite preview --port 4184 --strictPort &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4184 > /dev/null; then break; fi
            sleep 1
          done
          CAPTURE_BASE_URL=http://localhost:4184 npm run test:hero-toggles
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      # Collapsed by default, remembered per device, and a chevron rather than
      # a text caret. All three are claims about the rendered DOM after a
      # mount — and the memory is checked by RELOADING, since reading state
      # back without one proves only that it is in memory.
      - name: The sidebar groups open shut and remember what you open
        run: |
          npx vite preview --port 4185 --strictPort &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4185 > /dev/null; then break; fi
            sleep 1
          done
          CAPTURE_BASE_URL=http://localhost:4185 npm run test:sidebar-groups
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      # P4's audit, kept as a gate. Five controls exercised, plus the one
      # thing source review cannot see: a control can work perfectly and be
      # unreadable, and the two values live in different components.
      - name: The builder Settings tab works and can be read
        run: |
          npx vite preview --port 4186 --strictPort &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4186 > /dev/null; then break; fi
            sleep 1
          done
          CAPTURE_BASE_URL=http://localhost:4186 npm run test:settings-tab
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      # The corners, at minimum and maximum zoom. The middle of the frame was
      # never the broken part — a guard that sampled it would have passed on
      # every build this fixes.
      - name: The seating grid reaches the edge of the frame at every zoom
        run: |
          npx vite preview --port 4190 --strictPort &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4190 > /dev/null; then break; fi
            sleep 1
          done
          CAPTURE_BASE_URL=http://localhost:4190 npm run test:seating-canvas
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      # Four states, and the last two are the ones a container query can
      # break: a real phone, which must be unchanged, and a real desktop,
      # which a query firing at every width would hand a hamburger.
      - name: The guest nav follows its frame, not the window
        run: |
          npx vite preview --port 4188 --strictPort &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4188 > /dev/null; then break; fi
            sleep 1
          done
          CAPTURE_BASE_URL=http://localhost:4188 npm run test:guest-nav-container
      # Two pieces of text in the same pixels is checkable; "does it look
      # right" is not. Every pair of leaf items in the bar is compared, at
      # both widths, and the desktop shape is pinned so a phone fix cannot
      # quietly restyle it.
      - name: Nothing in the builder header overlaps at 390
        run: |
          npx vite preview --port 4187 --strictPort &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4187 > /dev/null; then break; fi
            sleep 1
          done
          CAPTURE_BASE_URL=http://localhost:4187 npm run test:builder-header-390
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      - name: The universe breadcrumb says where it goes
        run: |
          npx vite preview --port 4180 --strictPort &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4180 > /dev/null; then break; fi
            sleep 1
          done
          CAPTURE_BASE_URL=http://localhost:4180 npm run test:universe-breadcrumb
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      - name: Onboarding resumes where the couple left it
        run: |
          npx vite preview --port 4179 --strictPort &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4179 > /dev/null; then break; fi
            sleep 1
          done
          CAPTURE_BASE_URL=http://localhost:4179 npm run test:onboarding-resume
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      - name: Prerendered freshness guard
        env:
          GH_EVENT_BEFORE: ${{ github.event.before }}
        run: npm run test:prerendered-freshness

      # Serves this PR's own build (not production — CAPTURE_BASE_URL
      # defaults to https://openinvite.com.au otherwise, which would test
      # whatever's already live instead of the change under review) and
      # points the marketing-routes smoke test at it.
      - name: Marketing-routes + guest-font-effect + no-invalid-date (against this build)
        run: |
          npx vite preview --port 4173 --strictPort &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null; then break; fi
            sleep 1
          done
          # A basic curl response doesn't mean the server is warmed up for a
          # real navigation yet — on a first CI run, the very first Playwright
          # route (waitUntil: networkidle) timed out at 30s here while every
          # other route (same page, ~2s each right after) passed fine
          # locally and in this same run. A few more real HTTP round-trips
          # before Playwright's first navigation avoids paying that cold-start
          # cost inside the 30s budget the smoke test itself enforces.
          for i in $(seq 1 5); do curl -sf http://localhost:4173/ > /dev/null; done
          CAPTURE_BASE_URL=http://localhost:4173 npm run test:marketing-routes
          TEST_EXIT=$?
          # The EFFECT-level half of guest typography. The static parity probe
          # in test:ci checks that files DECLARE the universe's faces; this
          # renders the pages and reads getComputedStyle, because
          # src/index.css's `* { font-family: … !important }` can override a
          # declaration and did on three routes. Same server, no extra boot.
          if [ $TEST_EXIT -eq 0 ]; then
            CAPTURE_BASE_URL=http://localhost:4173 npm run test:guest-font-effect
            TEST_EXIT=$?
          fi
          # Every guest of every wedding once saw "Invalid Date" as a day header
          # on the celebration page, in all 20 universes, because the call sat
          # inside a try/catch that could not fire — toLocaleDateString RETURNS
          # "Invalid Date" rather than throwing. Source review read it as
          # defended. Only a render shows the text a guest actually gets.
          # R37: one table shell for every list-shaped surface. The static
          # half (data-table.mjs, in test:ci) proves the pages IMPORT it; only
          # a render proves they look the same, because src/index.css's
          # `* { font-family: … !important }` and a Tailwind class three layers
          # up decide the cell. Same server, no extra boot.
          if [ $TEST_EXIT -eq 0 ]; then
            CAPTURE_BASE_URL=http://localhost:4173 npm run test:table-typography
            TEST_EXIT=$?
          fi
          # THE TAB HAS TO MOUNT. The run sheet went to the error boundary on
          # the owner's own record while every source check was green: no test
          # had ever rendered that tab WITH ROWS IN IT, and the crash needed
          # rows. Source checks cannot see this class at all.
          if [ $TEST_EXIT -eq 0 ]; then
            CAPTURE_BASE_URL=http://localhost:4173 npm run test:schedule-tabs
            TEST_EXIT=$?
          fi
          # The daily update paints before Ava speaks. The briefing endpoint is
          # held open for 6s and the check is whether the page is already
          # there — the owner's "~10 seconds, shows nothing while loading".
          if [ $TEST_EXIT -eq 0 ]; then
            CAPTURE_BASE_URL=http://localhost:4173 npm run test:daily-update-paint
            TEST_EXIT=$?
          fi
          # Nothing interactive under the floating Ava button. elementFromPoint
          # at its rect on a page set — the owner found the Send invites
          # "Next" behind it, and no source scan can see that.
          if [ $TEST_EXIT -eq 0 ]; then
            CAPTURE_BASE_URL=http://localhost:4173 npm run test:ava-safe-area
            TEST_EXIT=$?
          fi
          # No page declares its own type scale or button size, and every
          # filter row is the shared pill. Both are render questions: the
          # previous pill inventory was done by grepping and missed rows.
          if [ $TEST_EXIT -eq 0 ]; then
            CAPTURE_BASE_URL=http://localhost:4173 npm run test:type-scale
            TEST_EXIT=$?
          fi
          if [ $TEST_EXIT -eq 0 ]; then
            CAPTURE_BASE_URL=http://localhost:4173 npm run test:filter-pills
            TEST_EXIT=$?
          fi
          # Every universe shows its own face. A source check passes on this
          # forever — the JSX declares the face and index.css's `*` rule
          # overrules it with !important. Only the render knows which won.
          if [ $TEST_EXIT -eq 0 ]; then
            CAPTURE_BASE_URL=http://localhost:4173 npm run test:universe-typography
            TEST_EXIT=$?
          fi
          if [ $TEST_EXIT -eq 0 ]; then
            CAPTURE_BASE_URL=http://localhost:4173 npm run test:guest-no-invalid-date

          # The postal address a couple types must come back out of the export.
          # Asserting the column exists would pass while the value was blank —
          # this clicks Export, captures the real download, and reads it.
          CAPTURE_BASE_URL=http://localhost:4173 npm run test:guest-export-address
            TEST_EXIT=$?
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          exit $TEST_EXIT
