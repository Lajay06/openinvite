<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- App identity -->
    <title>Openinvite</title>
    <meta name="description" content="The all-in-one wedding planning platform. Pay once, plan everything: guests, budget, schedule, invitations and 20 aesthetic universes." />
    <meta name="application-name" content="Openinvite" />
    <meta name="apple-mobile-web-app-title" content="Openinvite" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph -->
    <meta property="og:title" content="Openinvite: Plan your perfect wedding" />
    <meta property="og:description" content="The all-in-one wedding planning platform. Pay once, plan everything." />
    <meta property="og:url" content="https://openinvite.com.au" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <!-- Plus Jakarta Sans is self-hosted (L1a): see src/main.jsx.
         The Google stylesheet and its two preconnects were removed here so no
         page opens a connection to Google just to render the app's own type.
         A preconnect is not free of disclosure: it performs DNS + TCP + TLS to
         the host, so leaving it would have kept every visitor's IP reaching
         Google even with the stylesheet gone.
         Universe display faces are still Google-loaded at runtime until L1b,
         and those call sites add their own preconnect when they need it. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
